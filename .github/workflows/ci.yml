name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  TF_VERSION: "1.12.1"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2

      - name: TFLint Init
        run: tflint --init

      - name: TFLint
        run: tflint

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      # Fork and Dependabot pull requests do not receive repository secrets.
      # Skip the LocalStack tests there instead of failing. A push to main
      # without the token still fails.
      - name: Check for LocalStack token
        id: token
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
        run: |
          if [ -n "$LOCALSTACK_AUTH_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = "push" ]; then
            echo "::error::LOCALSTACK_AUTH_TOKEN is not set"
            exit 1
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping tests because LOCALSTACK_AUTH_TOKEN is not available to this pull request"
          fi

      - if: steps.token.outputs.present == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - if: steps.token.outputs.present == 'true'
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
          terraform_version: ${{ env.TF_VERSION }}

      - name: Start LocalStack
        if: steps.token.outputs.present == 'true'
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
        run: docker compose up -d --wait

      - name: Terraform Init
        if: steps.token.outputs.present == 'true'
        run: terraform init

      - name: Terraform Test
        if: steps.token.outputs.present == 'true'
        run: terraform test
